[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyimdb"
dynamic = ["version"]
description = "Python metadata client for IMDb (suggestion API + bulk datasets + best-effort page crawl)"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "unblock_requests",
]

[project.optional-dependencies]
stealth = ["curl-cffi"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/TigreGotico/pyimdb"

[tool.setuptools.dynamic]
version = { attr = "pyimdb.version.__version__" }

[tool.setuptools.packages.find]
include = ["pyimdb*"]

[tool.pytest.ini_options]
markers = [
    "live: hits the network (deselect with '-m \"not live\"')",
]
